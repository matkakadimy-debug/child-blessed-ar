<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>المشهد 6 – العبرة</title>
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.min.js"></script>
  <style>
    body,html{margin:0;height:100%;background:#000;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;} 
    .hint{position:fixed;bottom:10px;left:0;right:0;color:#fff;text-align:center;font-size:14px;opacity:.9}
    .card{position:fixed;top:8px;left:8px;right:8px;background:rgba(255,255,255,.85);backdrop-filter: blur(6px);padding:10px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.15);}
    .title{font-weight:700;margin-bottom:6px;font-size:16px}
    .line{font-size:14px}
  </style>
</head>
<body>
  <div class="card">
    <div class="title">المشهد 6 – العبرة</div>
    <div class="line">الراوي: منذ طفولته ﷺ رافقته البركة، فهو رحمة للعالمين.</div>
  </div>
  <div class="hint">وجّه الكاميرا نحو العلامة (Hiro) لبدء العرض</div>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <!-- نموذج مبدئي يمكن استبداله لاحقًا بـ glb -->
      <a-box position="0 0.5 0" material="color: #2e7d32; opacity: 0.9"></a-box>
      <a-entity position="0 1.2 0" text="value:المشهد 6 – العبرة;color:#fff;align:center;wrapCount:18"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
